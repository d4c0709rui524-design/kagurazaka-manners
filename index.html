<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>神楽坂 横丁マナークイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5;
  --text:#101014; --text-2:#5f5f6b; --text-3:#9a9aa6; --sep:#e8e8ee;
  --brand-1:#ff6a3d; --brand-2:#e5303f; --brand-3:#9b1f5a;
  --grad:linear-gradient(135deg,var(--brand-1) 0%,var(--brand-2) 48%,var(--brand-3) 100%);
  --brand:#e5303f;
  --ok:#12b76a; --ok-bg:#e8f8f0; --ng:#f04438; --ng-bg:#fef0ef;
  --gold:#f5c26b;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,16,20,.04),0 8px 24px rgba(16,16,20,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Noto Sans SC","Noto Sans TC","Noto Sans KR","Noto Sans Thai",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
}
button{font:inherit;color:inherit}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app bar ---------- */
.appbar{
  position:sticky;top:0;z-index:10;height:60px;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
}
.appbar-in{max-width:520px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px -3px rgba(229,48,63,.5)}
.logo .ico{width:20px;height:20px;stroke-width:2}
.brand-text{line-height:1.15}
.brand-text b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand-text span{font-size:10.5px;font-weight:600;color:var(--text-3);letter-spacing:.08em}
.pill-btn{
  appearance:none;border:0;background:var(--surface-2);border-radius:999px;height:36px;padding:0 12px 0 10px;
  display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .2s
}
.pill-btn:hover{background:#e9e9ee}
.pill-btn .ico{width:18px;height:18px}
.pill-btn .chev{width:14px;height:14px;opacity:.6}

/* ---------- layout ---------- */
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px 20px}
.fade{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

/* ---------- intro ---------- */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--grad);color:#fff;padding:22px 20px 26px;margin-bottom:14px;box-shadow:0 14px 30px -14px rgba(155,31,90,.55)}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;right:40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.chip .ico{width:15px;height:15px;stroke-width:2}
.chip-glass{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);color:#fff}
.hero-icon{position:relative;z-index:1;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;margin:18px 0 16px}
.hero-icon .ico{width:34px;height:34px;stroke-width:1.6;color:#fff}
.hero h1{position:relative;z-index:1;font-size:27px;line-height:1.25;margin:0 0 6px;font-weight:900;letter-spacing:-.02em}
.hero .sub{position:relative;z-index:1;margin:0;font-size:14px;font-weight:600;opacity:.92}

.lead{color:var(--text-2);margin:0 0 18px;font-size:15px}
.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.feature{background:var(--surface-2);border-radius:var(--r-md);padding:14px 8px 12px;text-align:center;font-size:12px;font-weight:600;color:var(--text-2);line-height:1.35}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin:0 auto 8px;color:#fff;background:var(--grad)}
.tile .ico{width:22px;height:22px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--ng-bg);color:#b42318;border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:18px}
.notice .ico{width:20px;height:20px;margin-top:1px}

/* ---------- buttons ---------- */
.btn{
  appearance:none;border:0;width:100%;height:54px;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),filter .2s,box-shadow .2s
}
.btn .ico{width:20px;height:20px;stroke-width:2.2}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(229,48,63,.65)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-dark{background:var(--text);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--text);margin-top:12px}

/* ---------- quiz ---------- */
.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.q-count{font-size:13px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.q-count em{font-style:normal;color:var(--brand)}
.seg{display:flex;gap:3px;margin-bottom:22px}
.seg i{flex:1;height:4px;border-radius:2px;background:var(--sep);transition:background .3s}
.seg i.done{background:var(--ok)}
.seg i.on{background:var(--grad)}
.q-icon{width:72px;height:72px;border-radius:22px;background:var(--grad);display:grid;place-items:center;color:#fff;margin-bottom:16px;box-shadow:0 10px 22px -10px rgba(229,48,63,.7)}
.q-icon .ico{width:36px;height:36px;stroke-width:1.7}
.qtext{font-size:20px;font-weight:800;line-height:1.45;margin:0 0 20px;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{
  appearance:none;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--sep);border-radius:var(--r-md);
  min-height:58px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;cursor:pointer;
  transition:border-color .15s,background .15s,transform .12s var(--ease)
}
.opt:hover:not(:disabled){border-color:#cfcfd8;background:#fafafb}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .mark{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);font-size:13px;font-weight:800;color:var(--text-2)}
.opt .mark .ico{width:17px;height:17px;stroke-width:2.6}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .mark{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt.ng .mark{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.ng){opacity:.45}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.fb{display:none;margin-top:16px;border-radius:var(--r-md);padding:14px;gap:12px;align-items:flex-start;animation:fade .3s var(--ease)}
.fb.show{display:flex}
.fb.good{background:var(--ok-bg)}
.fb.bad{background:var(--ng-bg)}
.fb .badge{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.fb.good .badge{background:var(--ok)}
.fb.bad .badge{background:var(--ng)}
.fb .badge .ico{width:20px;height:20px;stroke-width:2.6}
.fb b{display:block;font-size:15px;margin-bottom:2px}
.fb.good b{color:#067647}
.fb.bad b{color:#b42318}
.fb p{margin:0;font-size:14px;color:var(--text-2)}
.next{display:none;margin-top:16px}
.next.show{display:block;animation:fade .3s var(--ease)}

/* ---------- done ---------- */
.success{text-align:center;padding:6px 0 4px}
.success-ring{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;animation:pop .5s var(--ease);box-shadow:0 12px 28px -10px rgba(229,48,63,.7)}
.success-ring .ico{width:42px;height:42px;stroke-width:2.6;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s var(--ease) forwards}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h2{font-size:21px;font-weight:900;margin:0 0 6px;line-height:1.35;letter-spacing:-.01em}
.success p{color:var(--text-2);margin:0 0 20px;font-size:14.5px}

.ticket{position:relative;border-radius:var(--r-lg);overflow:hidden;color:#fff;background:#16161c;margin-bottom:14px}
.ticket-head{background:var(--grad);padding:18px 18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ticket-head small{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.9;margin-bottom:6px}
.ticket-head small .ico{width:15px;height:15px}
.ticket-head h3{margin:0;font-size:19px;font-weight:800;line-height:1.3}
.hanko{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;text-align:center;font:900 11.5px/1.15 "Noto Sans JP",sans-serif;transform:rotate(-12deg);background:rgba(255,255,255,.1)}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.18);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--surface)}
.perf::before{left:-30px}.perf::after{right:-30px}
.ticket-body{padding:18px}
.live{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6ce9a6;background:rgba(18,183,106,.16);padding:4px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:#32d583;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.clock{font:700 30px/1 Inter,ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#a7a7b4;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.kv strong{color:#fff;font-weight:600;text-align:right}
.code{font:700 22px/1 Inter,ui-monospace,monospace;letter-spacing:.14em;text-align:center;background:rgba(255,255,255,.06);border-radius:var(--r-sm);padding:14px 10px;margin:6px 0 14px}
.how{display:flex;gap:8px;font-size:13.5px;color:#e6e6ee;margin-bottom:4px}
.how .ico{width:18px;height:18px;margin-top:2px;color:var(--gold)}
.terms{font-size:11.5px;color:#8a8a97;padding-left:26px}

.staff{display:flex;gap:10px;background:#fff7e6;color:#7a4b00;border-radius:var(--r-md);padding:13px 14px;font-size:13px;margin-bottom:6px}
.staff .ico{width:20px;height:20px;margin-top:1px;color:#dc8a00}
.staff b{display:block;font-size:12.5px;margin-bottom:1px}

.section-title{font-size:13px;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin:24px 4px 10px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--sep);overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px}
.list li+li{border-top:1px solid var(--sep)}
.list .tile{margin:0;width:38px;height:38px;border-radius:11px}
.list .tile .ico{width:20px;height:20px}
.list .tile.soft{background:var(--surface-2);color:var(--text)}
.list .grow{flex:1;font-size:14.5px;font-weight:600;line-height:1.4}
.badge-off{font-size:12px;font-weight:700;color:var(--brand);background:#fdecee;border-radius:999px;padding:5px 10px;white-space:nowrap}
.note{font-size:12px;color:var(--text-3);margin:8px 4px 0}

footer{text-align:center;font-size:11.5px;color:var(--text-3);margin-top:22px}

/* ---------- language sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,14,.4);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet-bg.open{display:flex;animation:bgin .2s}
@keyframes bgin{from{background:rgba(10,10,14,0)}}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 12px calc(16px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.grabber{width:38px;height:5px;border-radius:3px;background:#d7d7de;margin:4px auto 12px}
.sheet h4{margin:0 8px 10px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h4 .ico{width:20px;height:20px;color:var(--brand)}
.langs{display:grid}
.langs button{appearance:none;border:0;background:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 10px;border-radius:12px;cursor:pointer;text-align:left}
.langs button:hover{background:var(--surface-2)}
.langs button span b{display:block;font-size:16px;font-weight:600}
.langs button span small{font-size:12px;color:var(--text-3)}
.langs .check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--sep);color:#fff}
.langs .check .ico{width:15px;height:15px;stroke-width:3;opacity:0}
.langs button.cur .check{background:var(--grad);border-color:transparent}
.langs button.cur .check .ico{opacity:1}


/* ---------- retry ---------- */
.retry-hero{text-align:center;padding:4px 0 2px}
.retry-ring{position:relative;width:96px;height:96px;margin:0 auto 16px}
.retry-ring svg.ring{width:96px;height:96px;transform:rotate(-90deg)}
.retry-ring .track{fill:none;stroke:var(--surface-2);stroke-width:8}
.retry-ring .bar{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.retry-ring .mid{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand)}
.retry-ring .mid .ico{width:34px;height:34px;stroke-width:2;animation:spinin .7s var(--ease)}
@keyframes spinin{from{transform:rotate(-200deg);opacity:0}}
.retry-hero h2{font-size:24px;font-weight:900;margin:0 0 6px;letter-spacing:-.01em}
.retry-hero p{color:var(--text-2);margin:0 0 20px;font-size:14.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:14px}
.stat small{display:block;font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:4px}
.stat b{font:800 28px/1 Inter,sans-serif;letter-spacing:-.02em}
.stat b span{font-size:15px;color:var(--text-3);font-weight:700}
.stat.best b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:4px;margin:0 0 18px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--sep)}
.dots i.ok{background:var(--ok)}
.dots i.ng{background:var(--ng)}
.tip{display:flex;gap:12px;align-items:flex-start;background:#fff7e6;border-radius:var(--r-md);padding:14px;margin-bottom:18px}
.tip .tile{margin:0;width:40px;height:40px;border-radius:12px;flex:none}
.tip .tile .ico{width:21px;height:21px}
.tip small{display:block;font-size:12px;font-weight:800;color:#b25e00;margin-bottom:2px}
.tip p{margin:0;font-size:14px;color:#5c3d00}
/* ---------- setup ---------- */
.setup-title{font-size:22px;font-weight:900;margin:0 0 4px;letter-spacing:-.01em}
.q-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:22px 0 10px}
.q-label .ico{width:20px;height:20px;color:var(--brand)}
.q-label .step{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.q-label .done-ic{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.q-label .done-ic .ico{width:14px;height:14px;stroke-width:3;color:#fff}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{appearance:none;border:1.5px solid var(--sep);background:var(--surface);border-radius:14px;min-height:52px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .12s var(--ease)}
.choice:hover{border-color:#cfcfd8}
.choice:active{transform:scale(.97)}
.choice b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.choice small{display:block;font-size:11.5px;color:var(--text-3);line-height:1.25}
.choice.sel{border-color:var(--brand);background:#fff4f3;box-shadow:0 0 0 3px rgba(229,48,63,.12)}
.cc{flex:none;width:34px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font:800 11.5px/1 Inter,sans-serif;letter-spacing:.04em;color:var(--text-2)}
.choice.sel .cc{background:var(--grad);color:#fff}
.ppl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ppl .choice{flex-direction:column;justify-content:center;gap:4px;min-height:74px;padding:10px 4px;text-align:center}
.ppl .choice .ico{width:24px;height:24px;color:var(--text-2)}
.ppl .choice.sel .ico{color:var(--brand)}
.ppl .choice b{font-size:17px;font-family:Inter,sans-serif}
.anon{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--text-3);margin:20px 2px 14px}
.anon .ico{width:16px;height:16px}
.btn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.profile-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px 8px 8px 12px;margin-bottom:14px}
.profile-bar .pchips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pchip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600}
.pchip .ico{width:15px;height:15px;color:var(--brand)}
.edit-btn{appearance:none;border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;cursor:pointer}
.edit-btn:hover{background:#fff4f3}
.edit-btn .ico{width:15px;height:15px}
.flag{flex:none;width:30px;height:22.5px;border-radius:5px;object-fit:cover;box-shadow:0 0 0 1px rgba(16,16,20,.1);display:block;background:var(--surface-2)}
.flag-ot{display:grid;place-items:center;color:var(--text-2);box-shadow:none}
.flag-ot .ico{width:16px;height:16px}
.flag.sm{width:20px;height:15px;border-radius:3.5px}
.choice.sel .flag{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--brand)}
.lrow{display:flex;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.success-ring .ico{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div class="brand-text"><b>横丁マナー</b><span>KAGURAZAKA</span></div>
    </div>
    <button class="pill-btn" id="langBtn" aria-haspopup="dialog">
      <span id="globe"></span><span id="langLabel">日本語</span><span id="chev"></span>
    </button>
  </div>
</header>

<div class="wrap">
  <main id="app"></main>
  <footer>神楽坂 横丁マナークイズ · 実証実験用プロトタイプ</footer>
</div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="grabber"></div>
    <h4 id="sheetTitle">Language</h4>

const MORE = {"ja": [["食べ終わったゴミを捨てたい。", ["持ち帰るか、買ったお店に相談する", "路地の隅にそっと置く", "植え込みの中に入れる"], "横丁にはゴミ箱がほとんどありません。ゴミは持ち帰りましょう。"], ["お店でおやつを買いました。どこで食べる？", ["お店の前など決められた場所で食べ終えてから歩く", "横丁を歩きながら食べる", "民家の玄関先に座って食べる"], "せまい横丁で食べ歩くと、人にぶつかったり石畳を汚したりします。食べ終えてから歩きましょう。"], ["料亭の玄関に、小さな塩の山が置いてあります。", ["触らず、踏まないようにする", "写真映えのために動かす", "何か気になって触ってみる"], "「盛り塩」はお客さまを迎えるためのお清めです。触ったり踏んだりしないでください。"], ["路地の奥に「私有地」と書かれた細い道があります。", ["入らずに引き返す", "写真映えしそうなので入ってみる", "少しだけならと奥をのぞきに行く"], "横丁の奥には家の玄関や私道があります。「私有地」「関係者以外立入禁止」の場所には入らないでください。"], ["タバコを吸いたくなりました。", ["決められた喫煙所で吸う", "横丁を歩きながら吸う", "人のいない路地の隅で吸う"], "新宿区では路上での喫煙が禁止されています。決められた喫煙所を使ってください。"], ["大きなスーツケースを持っています。", ["横丁は避けて大通りを通るか、持ち上げて静かに運ぶ", "石畳の上をゴロゴロ引いて歩く", "道の真ん中に置いて休む"], "石畳ではキャスターの音が大きく響き、せまい道もふさいでしまいます。"], ["家の前に植木鉢や飾りが並んでいます。", ["触らずに眺めるだけにする", "植木鉢に腰かけて休む", "飾りを動かして写真を撮る"], "住民が大切に手入れしているものです。触ったり動かしたりしないでください。"]], "en": [["You want to throw away trash after eating.", ["Take it with you, or ask the shop where you bought it", "Leave it quietly in a corner of the alley", "Tuck it into the plants"], "There are almost no trash bins in the alleys. Please take your trash with you."], ["You bought a snack at a shop. Where should you eat it?", ["At the shop or a designated spot, then walk on", "While walking through the alley", "Sitting on someone's doorstep"], "In the narrow alleys, eating while walking can mean bumping into people or dirtying the stone paving. Finish eating first, then walk."], ["You see a small cone of salt at a ryotei entrance.", ["Don't touch it or step on it", "Move it for a better photo", "Touch it to see what it is"], "Morishio is a small mound of purifying salt placed to welcome guests. Please don't touch or step on it."], ["Deep in the alley there's a narrow path marked \"Private property\".", ["Don't enter — turn back", "Go in because it looks photogenic", "Go in just a little to peek"], "Behind the alleys are homes and private paths. Please don't enter places marked private or staff only."], ["You want to smoke.", ["Smoke only at a designated smoking area", "Smoke while walking through the alley", "Smoke in an empty corner of the alley"], "Smoking on the street is prohibited in Shinjuku City. Please use designated smoking areas."], ["You have a large suitcase with you.", ["Avoid the alleys and use the main street, or carry it quietly", "Roll it noisily over the stone paving", "Leave it in the middle of the path while you rest"], "Wheels echo loudly on stone paving, and suitcases block the narrow lanes."], ["Potted plants and decorations line the front of a house.", ["Just enjoy them without touching", "Sit on a flower pot to rest", "Move the decorations for a photo"], "Residents look after these with care. Please don't touch or move them."]], "zh": [["吃完东西想扔垃圾。", ["带走，或询问购买的店铺", "悄悄放在小巷角落", "塞进植物丛里"], "横丁里几乎没有垃圾桶。请把垃圾带走。"], ["在店里买了小吃。应该在哪里吃？", ["在店门口等指定地点吃完再走", "边走边吃逛横丁", "坐在民宅门口吃"], "在狭窄的横丁边走边吃，容易撞到人或弄脏石板路。请吃完再走。"], ["料亭门口放着一小堆盐。", ["不碰也不踩", "为了拍照挪开它", "摸一摸看看是什么"], "这叫“盛盐”，是迎接客人的净化之物。请勿触碰或踩踏。"], ["小巷深处有一条写着“私人土地”的小路。", ["不进入，原路返回", "看起来很上镜，走进去", "只进去一点点看看"], "横丁深处有住宅和私人道路。标有“私人土地”或“非相关人员禁止入内”的地方请勿进入。"], ["想抽烟了。", ["只在指定吸烟区吸烟", "边走边在横丁里抽", "在没人的小巷角落抽"], "新宿区禁止在路上吸烟。请使用指定的吸烟区。"], ["带着一个大行李箱。", ["避开横丁走大路，或提起来安静搬运", "在石板路上拖得轰隆作响", "放在路中间休息"], "行李箱轮子在石板路上声音很大，还会挡住狭窄的道路。"], ["民宅门前摆着盆栽和装饰。", ["只看不碰", "坐在花盆上休息", "移动装饰来拍照"], "这些是居民精心照料的物品。请勿触碰或移动。"]], "zt": [["吃完東西想丟垃圾。", ["帶走，或詢問購買的店家", "悄悄放在小巷角落", "塞進植物叢裡"], "橫丁裡幾乎沒有垃圾桶。請把垃圾帶走。"], ["在店裡買了點心。應該在哪裡吃？", ["在店門口等指定地點吃完再走", "邊走邊吃逛橫丁", "坐在民宅門口吃"], "在狹窄的橫丁邊走邊吃，容易撞到人或弄髒石板路。請吃完再走。"], ["料亭門口放著一小堆鹽。", ["不碰也不踩", "為了拍照移開它", "摸一摸看看是什麼"], "這叫「盛鹽」，是迎接客人的淨化之物。請勿觸碰或踩踏。"], ["小巷深處有一條寫著「私有地」的小路。", ["不進入，原路返回", "看起來很好拍，走進去", "只進去一點點看看"], "橫丁深處有住宅和私人道路。標有「私有地」或「非相關人員禁止進入」的地方請勿進入。"], ["想抽菸了。", ["只在指定吸菸區吸菸", "邊走邊在橫丁裡抽", "在沒人的小巷角落抽"], "新宿區禁止在路上吸菸。請使用指定的吸菸區。"], ["帶著一個大行李箱。", ["避開橫丁走大路，或提起來安靜搬運", "在石板路上拖得轟隆作響", "放在路中間休息"], "行李箱輪子在石板路上聲音很大，還會擋住狹窄的道路。"], ["民宅門前擺著盆栽和裝飾。", ["只看不碰", "坐在花盆上休息", "移動裝飾來拍照"], "這些是居民用心照顧的物品。請勿觸碰或移動。"]], "ko": [["다 먹은 쓰레기를 버리고 싶어요.", ["가져가거나, 구매한 가게에 물어보기", "골목 구석에 살짝 두기", "화단 속에 넣기"], "골목에는 쓰레기통이 거의 없습니다. 쓰레기는 가져가 주세요."], ["가게에서 간식을 샀어요. 어디서 먹을까요?", ["가게 앞 등 정해진 곳에서 다 먹고 걷기", "골목을 걸으며 먹기", "주택 현관 앞에 앉아서 먹기"], "좁은 골목에서 걸으며 먹으면 사람과 부딪히거나 돌길을 더럽히기 쉽습니다. 다 먹은 뒤 걸어 주세요."], ["료테이 입구에 작은 소금 더미가 있어요.", ["만지지도 밟지도 않기", "사진을 위해 옮기기", "무엇인지 만져 보기"], "모리시오(盛り塩)는 손님을 맞이하기 위한 정화의 소금입니다. 만지거나 밟지 마세요."], ["골목 안쪽에 '사유지'라고 적힌 좁은 길이 있어요.", ["들어가지 않고 되돌아가기", "사진이 잘 나올 것 같아 들어가기", "조금만 들어가서 들여다보기"], "골목 안쪽에는 주택과 사유 도로가 있습니다. '사유지', '관계자 외 출입 금지' 표시가 있는 곳에는 들어가지 마세요."], ["담배를 피우고 싶어요.", ["지정된 흡연 장소에서만 피우기", "골목을 걸으며 피우기", "사람 없는 골목 구석에서 피우기"], "신주쿠구에서는 길거리 흡연이 금지되어 있습니다. 지정된 흡연 장소를 이용해 주세요."], ["큰 캐리어를 가지고 있어요.", ["골목을 피해 큰길로 가거나, 들어서 조용히 옮기기", "돌길 위에서 덜컹덜컹 끌고 가기", "길 한가운데 두고 쉬기"], "돌길에서는 바퀴 소리가 크게 울리고, 좁은 길도 막게 됩니다."], ["집 앞에 화분과 장식이 놓여 있어요.", ["만지지 않고 구경만 하기", "화분에 걸터앉아 쉬기", "사진을 위해 장식 옮기기"], "주민들이 소중히 가꾸는 것입니다. 만지거나 옮기지 마세요."]], "fr": [["Vous voulez jeter vos déchets après avoir mangé.", ["Les emporter, ou demander à la boutique où vous avez acheté", "Les poser discrètement dans un coin de la ruelle", "Les cacher dans les plantes"], "Il n'y a presque pas de poubelles dans les ruelles. Merci d'emporter vos déchets."], ["Vous avez acheté un en-cas. Où le manger ?", ["Devant la boutique ou à un endroit prévu, puis repartir", "En marchant dans la ruelle", "Assis sur le seuil d'une maison"], "Dans les ruelles étroites, manger en marchant fait heurter les passants ou salit les pavés. Terminez avant de repartir."], ["Vous voyez un petit cône de sel à l'entrée d'un ryōtei.", ["Ne pas le toucher ni marcher dessus", "Le déplacer pour une meilleure photo", "Le toucher pour voir ce que c'est"], "Le morishio est un petit tas de sel purificateur placé pour accueillir les clients. Merci de ne pas y toucher ni marcher dessus."], ["Au fond de la ruelle, un passage étroit porte l'inscription « Propriété privée ».", ["Ne pas entrer et faire demi-tour", "Entrer car c'est photogénique", "Entrer juste un peu pour jeter un œil"], "Derrière les ruelles se trouvent des maisons et des passages privés. N'entrez pas dans les lieux indiqués comme privés ou réservés."], ["Vous avez envie de fumer.", ["Fumer uniquement dans un espace fumeur désigné", "Fumer en marchant dans la ruelle", "Fumer dans un coin vide de la ruelle"], "Fumer dans la rue est interdit dans l'arrondissement de Shinjuku. Utilisez les espaces fumeurs désignés."], ["Vous avez une grosse valise.", ["Éviter les ruelles par la grande rue, ou la porter sans bruit", "La faire rouler bruyamment sur les pavés", "La laisser au milieu du chemin pour se reposer"], "Les roulettes résonnent fort sur les pavés, et une valise bloque les passages étroits."], ["Des pots de plantes et des décorations bordent l'entrée d'une maison.", ["Les admirer sans les toucher", "S'asseoir sur un pot pour se reposer", "Déplacer les décorations pour une photo"], "Les habitants en prennent grand soin. Merci de ne pas les toucher ni les déplacer."]], "es": [["Quieres tirar la basura después de comer.", ["Llevártela o preguntar en la tienda donde compraste", "Dejarla discretamente en una esquina del callejón", "Meterla entre las plantas"], "Casi no hay papeleras en los callejones. Por favor, llévate tu basura."], ["Compraste un tentempié en una tienda. ¿Dónde lo comes?", ["Frente a la tienda o en un lugar indicado, y luego sigues", "Caminando por el callejón", "Sentado en la entrada de una casa"], "En los callejones estrechos, comer caminando puede hacer que choques con gente o ensucies el empedrado. Termina primero y luego camina."], ["Ves un pequeño cono de sal en la entrada de un ryotei.", ["No tocarlo ni pisarlo", "Moverlo para una mejor foto", "Tocarlo para ver qué es"], "El morishio es un montoncito de sal purificadora para recibir a los clientes. No lo toques ni lo pises."], ["Al fondo del callejón hay un paso estrecho con un cartel de «Propiedad privada».", ["No entrar y dar la vuelta", "Entrar porque es fotogénico", "Entrar solo un poco para mirar"], "Detrás de los callejones hay casas y pasos privados. No entres en lugares marcados como privados o solo para personal."], ["Tienes ganas de fumar.", ["Fumar solo en una zona de fumadores designada", "Fumar caminando por el callejón", "Fumar en una esquina vacía del callejón"], "En el distrito de Shinjuku está prohibido fumar en la calle. Usa las zonas de fumadores designadas."], ["Llevas una maleta grande.", ["Evitar los callejones por la calle principal, o cargarla sin ruido", "Arrastrarla ruidosamente por el empedrado", "Dejarla en medio del camino para descansar"], "Las ruedas retumban en el empedrado y la maleta bloquea los pasos estrechos."], ["Frente a una casa hay macetas y adornos.", ["Mirarlos sin tocarlos", "Sentarse en una maceta para descansar", "Mover los adornos para una foto"], "Los vecinos los cuidan con esmero. No los toques ni los muevas."]], "de": [["Sie möchten nach dem Essen Ihren Müll wegwerfen.", ["Mitnehmen oder im Geschäft nachfragen, wo Sie gekauft haben", "Unauffällig in einer Ecke der Gasse abstellen", "In die Pflanzen stecken"], "In den Gassen gibt es kaum Mülleimer. Bitte nehmen Sie Ihren Müll mit."], ["Sie haben einen Snack gekauft. Wo essen Sie ihn?", ["Vor dem Geschäft oder an einem vorgesehenen Ort, dann weitergehen", "Im Gehen durch die Gasse", "Auf der Türschwelle eines Hauses sitzend"], "In den engen Gassen stößt man beim Essen im Gehen leicht mit anderen zusammen oder verschmutzt das Pflaster. Bitte erst aufessen, dann weitergehen."], ["Am Eingang eines Ryōtei sehen Sie einen kleinen Salzkegel.", ["Nicht berühren und nicht darauf treten", "Für ein besseres Foto verschieben", "Anfassen, um zu sehen, was es ist"], "Morishio ist ein reinigender Salzhügel zur Begrüßung der Gäste. Bitte nicht berühren oder darauf treten."], ["Hinten in der Gasse ist ein schmaler Weg mit dem Schild „Privatgrundstück“.", ["Nicht betreten und umkehren", "Hineingehen, weil es fotogen aussieht", "Nur ein kleines Stück hineingehen und schauen"], "Hinter den Gassen liegen Wohnhäuser und Privatwege. Bitte betreten Sie keine als privat oder nur für Befugte gekennzeichneten Orte."], ["Sie möchten rauchen.", ["Nur in einem ausgewiesenen Raucherbereich rauchen", "Im Gehen in der Gasse rauchen", "In einer leeren Ecke der Gasse rauchen"], "Im Bezirk Shinjuku ist das Rauchen auf der Straße verboten. Bitte nutzen Sie die ausgewiesenen Raucherbereiche."], ["Sie haben einen großen Koffer dabei.", ["Die Gassen meiden und die Hauptstraße nehmen oder ihn leise tragen", "Ihn laut über das Pflaster rollen", "Ihn zum Ausruhen mitten auf dem Weg abstellen"], "Rollen hallen laut auf dem Pflaster, und Koffer versperren die engen Wege."], ["Vor einem Haus stehen Blumentöpfe und Dekorationen.", ["Nur anschauen, nicht berühren", "Sich zum Ausruhen auf einen Blumentopf setzen", "Die Dekoration für ein Foto verschieben"], "Die Anwohner pflegen sie mit viel Sorgfalt. Bitte nicht berühren oder verschieben."]], "th": [["คุณอยากทิ้งขยะหลังกินเสร็จ", ["นำกลับไปด้วย หรือสอบถามร้านที่ซื้อ", "วางไว้เงียบ ๆ ที่มุมตรอก", "ยัดไว้ในพุ่มไม้"], "ในตรอกแทบไม่มีถังขยะ กรุณานำขยะกลับไปด้วย"], ["คุณซื้อขนมจากร้าน ควรกินที่ไหน?", ["กินให้เสร็จหน้าร้านหรือจุดที่กำหนด แล้วค่อยเดินต่อ", "เดินกินไปตามตรอก", "นั่งกินหน้าประตูบ้านคนอื่น"], "ในตรอกแคบ การเดินกินอาจชนผู้อื่นหรือทำให้พื้นหินสกปรก กรุณากินให้เสร็จก่อนแล้วค่อยเดิน"], ["คุณเห็นกองเกลือเล็ก ๆ ที่หน้าประตูเรียวเต", ["ไม่แตะและไม่เหยียบ", "ย้ายออกเพื่อถ่ายรูปให้สวย", "ลองแตะดูว่าคืออะไร"], "โมริชิโอะคือกองเกลือเพื่อความบริสุทธิ์ที่วางไว้ต้อนรับแขก กรุณาอย่าแตะหรือเหยียบ"], ["ลึกเข้าไปในตรอกมีทางแคบที่เขียนว่า \"ที่ดินส่วนบุคคล\"", ["ไม่เข้าไป และเดินกลับ", "เข้าไปเพราะดูน่าถ่ายรูป", "เข้าไปนิดเดียวเพื่อแอบดู"], "ด้านในตรอกมีบ้านและทางส่วนบุคคล กรุณาอย่าเข้าไปในที่ที่มีป้ายส่วนบุคคลหรือห้ามบุคคลภายนอก"], ["คุณอยากสูบบุหรี่", ["สูบเฉพาะในจุดสูบบุหรี่ที่กำหนด", "เดินสูบไปในตรอก", "สูบที่มุมตรอกที่ไม่มีคน"], "เขตชินจูกุห้ามสูบบุหรี่บนถนน กรุณาใช้จุดสูบบุหรี่ที่กำหนด"], ["คุณมีกระเป๋าเดินทางใบใหญ่", ["เลี่ยงตรอกไปใช้ถนน const RETRY_S = {"ja": {"retryTitle": "もう一度チャレンジ！", "retryLead": "落ち着いて、10問連続正解を目指しましょう。", "score": "今回の記録", "best": "ベスト記録", "unit": "{n}問正解", "missedTip": "前回まちがえた問題のポイント", "go": "スタート"}, "en": {"retryTitle": "Try again!", "retryLead": "Take it easy and aim for 10 in a row.", "score": "This round", "best": "Best", "unit": "{n} correct", "missedTip": "Key point from the question you missed", "go": "Start"}, "zh": {"retryTitle": "再挑战一次！", "retryLead": "放轻松，目标是连续答对10题。", "score": "本次成绩", "best": "最佳成绩", "unit": "答对{n}题", "missedTip": "上次答错题目的要点", "go": "开始"}, "zt": {"retryTitle": "再挑戰一次！", "retryLead": "放輕鬆，目標是連續答對10題。", "score": "本次成績", "best": "最佳成績", "unit": "答對{n}題", "missedTip": "上次答錯題目的重點", "go": "開始"}, "ko": {"retryTitle": "다시 도전!", "retryLead": "차분하게 10문제 연속 정답을 노려 보세요.", "score": "이번 기록", "best": "최고 기록", "unit": "{n}문제 정답", "missedTip": "지난번 틀린 문제의 포인트", "go": "시작"}, "fr": {"retryTitle": "On recommence !", "retryLead": "Prenez votre temps et visez 10 bonnes réponses d'affilée.", "score": "Cette partie", "best": "Record", "unit": "{n} bonne(s) réponse(s)", "missedTip": "À retenir de la question manquée", "go": "Commencer"}, "es": {"retryTitle": "¡Inténtalo de nuevo!", "retryLead": "Con calma, intenta acertar 10 seguidas.", "score": "Esta ronda", "best": "Mejor marca", "unit": "{n} correctas", "missedTip": "Clave de la pregunta que fallaste", "go": "Empezar"}, "de": {"retryTitle": "Neuer Versuch!", "retryLead": "Ganz ruhig – Ziel sind 10 richtige Antworten in Folge.", "score": "Diese Runde", "best": "Bestwert", "unit": "{n} richtig", "missedTip": "Das Wichtigste zur verpassten Frage", "go": "Starten"}, "th": {"retryTitle": "ลองอีกครั้ง!", "retryLead": "ใจเย็น ๆ ตั้งเป้าตอบถูก 10 ข้อติดกัน", "score": "รอบนี้", "best": "สถิติดีที่สุด", "unit": "ถูก {n} ข้อ", "missedTip": "ประเด็นสำคัญจากข้อที่ตอบผิด", "go": "เริ่ม"}, "vi": {"retryTitle": "Thử lại nào!", "retryLead": "Bình tĩnh, hãy cố gắng đúng 10 câu liên tiếp.", "score": "Lượt này", "best": "Kỷ lục", "unit": "Đúng {n} câu", "missedTip": "Điểm chính của câu bạn trả lời sai", "go": "Bắt đầu"}};
for(const k in RETRY_S) Object.assign(T[k], RETRY_S[k]);
// 国・地域リスト（名前は Intl で各言語に自動翻訳）
const COUNTRIES = ["KR","CN","TW","HK","US","TH","AU","PH","SG","VN","MY","ID","IN","CA","GB","FR","DE","IT","ES","MX","BR","JP"];
const LANG_COUNTRY = {ja:["JP"],en:["US","GB","AU","CA","SG"],zh:["CN","SG","MY"],zt:["TW","HK"],ko:["KR"],fr:["FR","CA"],es:["ES","MX"],de:["DE"],th:["TH"],vi:["VN"]};
function countryName(code,lc){
  if(code==="OT") return T[lc].other;
  try{ return new Intl.DisplayNames([LOCALE[lc]],{type:"region"}).of(code); }catch(e){ return code; }
}
function sortedCountries(){
  const pri = LANG_COUNTRY[lang]||[];
  return [...pri, ...COUNTRIES.filter(c=>!pri.includes(c))];
}
const ic = (n,cls="") => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const QICON = ["quiet","noCamera","walk","trash","dango","salt","door","noSmoking","suitcase","plant"];

/* ============ 状態 ============ */
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function detectLang(){
  const saved = store.get("kgz_lang"); if(saved && T[saved]) return saved;
  const n = (navigator.language||"ja").toLowerCase();
  if(n.startsWith("zh")) return /tw|hk|mo|hant/.test(n) ? "zt" : "zh";
  const two = n.slice(0,2);
  return T[two] ? two : "en";
}
let lang = detectLang();
const NQ = 10;
let state = { view:"intro", qi:0, qorder:[], order:[], solved:false, failed:false, picked:null };
let clockTimer = null;
let profile = store.get("kgz_profile");
let draft = null;
const app = document.getElementById("app");
const t = k => T[lang][k];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function spotName(){
  const s = SPOTS[(location.hash||"").replace("#","")]; if(!s) return null;
  if(lang==="ja") return s.ja; if(lang==="zh") return s.zh; if(lang==="zt") return s.zt; if(lang==="ko") return s.ko;
  return s.latin;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const top0 = ()=>{ try{ window.scrollTo({top:0,behavior:"smooth"}) }catch(e){} };

/* ============ 画面：はじめに（言語・人数・国） ============ */
function renderSetup(){
  if(!draft) draft = Object.assign({people:null,country:null,langChosen:!!store.get("kgz_lang")}, profile||{});
  const ready = draft.langChosen && draft.people && draft.country;
  const doneIc = `<span class="done-ic">${ic("check")}</span>`;
  app.innerHTML = `<section class="card fade">
    <h2 class="setup-title">${esc(t("setupTitle"))}</h2>

    <div class="q-label"><span class="step">1</span>${esc(t("langQ"))}${draft.langChosen?doneIc:""}</div>
    <div class="choice-grid">${LANGS.map(([c,n,e])=>`<button class="choice ${draft.langChosen&&c===lang?'sel':''}" data-l="${c}" lang="${HTML_LANG[c]}">${flag(LANG_FLAG[c])}<span><b>${n}</b><small>${e}</small></span></button>`).join("")}</div>

    <div class="q-label"><span class="step">2</span>${esc(t("people"))}${draft.people?doneIc:""}</div>
    <div class="ppl">${[1,2,3,4,5].map(n=>`<button class="choice ${draft.people===n?'sel':''}" data-p="${n}" aria-label="${n===5?'5+':n}">${ic(n===1?"user":"users")}<b>${n===5?"5+":n}</b></button>`).join("")}</div>

    <div class="q-label"><span class="step">3</span>${esc(t("country"))}${draft.country?doneIc:""}</div>
    <div class="choice-grid">${[...sortedCountries(),"OT"].map(c=>`<button class="choice ${draft.country===c?'sel':''}" data-c="${c}">${flag(c)}<b>${esc(countryName(c,lang))}</b></button>`).join("")}</div>

    <p class="anon">${ic("info")}${esc(t("anon"))}</p>
    <button class="btn btn-primary" id="setupNext" ${ready?"":"disabled"}>${esc(t("next"))}${ic("arrow")}</button>
  </section>`;
  const keepY = ()=>{ const y=window.scrollY; renderSetup(); try{window.scrollTo(0,y)}catch(e){} };
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ lang=b.dataset.l; store.set("kgz_lang",lang); draft.langChosen=true; document.documentElement.lang=HTML_LANG[lang]; document.getElementById("langLabel").textContent=LANGS.find(l=>l[0]===lang)[1]; document.getElementById("globe").innerHTML=flag(LANG_FLAG[lang],"sm"); keepY(); });
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ draft.people=+b.dataset.p; keepY(); });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ draft.country=b.dataset.c; keepY(); });
  document.getElementById("setupNext").onclick = ()=>{
    profile = {people:draft.people, country:draft.country}; store.set("kgz_profile",profile); draft=null;
    state.view="intro"; render(); top0();
  };
}
function profileBar(){
  if(!profile) return "";
  return `<div class="profile-bar">
    <div class="pchips">
      <span class="pchip">${ic(profile.people===1?"user":"users")}${profile.people===5?"5+":profile.people}</span>
      <span class="pchip">${flag(profile.country,"sm")}${esc(countryName(profile.country,lang))}</span>
      <span class="pchip">${flag(LANG_FLAG[lang],"sm")}${LANGS.find(l=>l[0]===lang)[1]}</span>
    </div>
    <button class="edit-btn" id="editProfile">${ic("edit")}${esc(t("edit"))}</button>
  </div>`;
}

/* ============ 画面：スタート ============ */
function renderIntro(){
  const sp = spotName();
  app.innerHTML = `<div class="fade">
    ${profileBar()}
    <section class="hero">
      ${sp?`<span class="chip chip-glass">${ic("pin")}${esc(t("at"))}: ${esc(sp)}</span>`:`<span class="chip chip-glass">${ic("lantern")}Kagurazaka</span>`}
      <div class="hero-icon">${ic("lantern")}</div>
      <h1>${esc(t("title"))}</h1>
      <p class="sub">${esc(t("sub"))}</p>
    </section>
    <section class="card">
      <p class="lead">${esc(t("lead"))}</p>
      <div class="feature-row">
        ${[["quiet","r1"],["noCamera","r2"],["walk","r3"]].map(([i,k])=>`<div class="feature"><div class="tile">${ic(i)}</div>${esc(t(k))}</div>`).join("")}
      </div>
      <div class="notice">${ic("alert")}<span>${esc(t("rule"))}</span></div>
      <button class="btn btn-primary" id="startBtn">${esc(t("start"))}${ic("arrow")}</button>
    </section>
  </div>`;
  document.getElementById("startBtn").onclick = restartQuiz;
  const eb=document.getElementById("editProfile"); if(eb) eb.onclick=()=>{ state.view="setup"; draft=null; render(); top0(); };
}

/* ============ 画面：クイズ ============ */
function startQ(){
  state.view="quiz"; state.solved=false; state.failed=false; state.picked=null;
  state.order = shuffle([0,1,2]); // 0 が正解
  renderQuiz();
}
function restartQuiz(){ state.qi=0; state.qorder=shuffle([...Array(NQ).keys()]); startQ(); top0(); }

function renderQuiz(){
  const qid = state.qorder[state.qi];
  const [qt,opts,exp] = t("q")[qid];
  const keys = ["A","B","C"];
  const over = state.solved || state.failed;
  const seg = [...Array(NQ).keys()].map(i=>`<i class="${i<state.qi?'done':i===state.qi?'on':''}"></i>`).join("");
  const label = esc(t("qOf").replace("{n}",`\u0000`)).replace("\u0000",`<em>${state.qi+1}</em>`);
  app.innerHTML = `<section class="card fade">
    <div class="q-top"><span class="q-count">${label}</span></div>
    <div class="seg">${seg}</div>
    <div class="q-icon">${ic(QICON[qid])}</div>
    <p class="qtext">${esc(qt)}</p>
    <div class="opts">
      ${state.order.map((oi,pos)=>{
        const ok = over && oi===0, ng = state.picked===oi && oi!==0;
        const mark = ok ? ic("check") : ng ? ic("x") : keys[pos];
        return `<button class="opt ${ok?'ok':''} ${ng?'ng':''}" data-oi="${oi}" ${over?"disabled":""}><span class="mark">${mark}</span><span>${esc(opts[oi])}</span></button>`;
      }).join("")}
    </div>
    <div class="fb ${state.solved?'show good':state.failed?'show bad':''}">
      ${over?`<div class="badge">${ic(state.solved?"check":"x")}</div><div><b>${esc(state.solved?t("correct"):t("wrongOver"))}</b><p>${esc(exp)}</p></div>`:""}
    </div>
    <div class="next ${over?'show':''}">
      ${state.failed
        ? `<button class="btn btn-dark" id="retryBtn">${ic("retry")}${esc(t("restart"))}</button>`
        : `<button class="btn btn-primary" id="nextBtn">${esc(state.qi<NQ-1?t("next"):t("finish"))}${ic("arrow")}</button>`}
    </div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const oi = +b.dataset.oi; state.picked = oi;
    if(oi===0){ state.solved=true; renderQuiz(); }
    else { state.failed=true; state.lastScore=state.qi; state.missed=qid; store.set("kgz_best", Math.max(store.get("kgz_best")||0, state.qi)); renderQuiz(); const el=app.querySelector(`.opt[data-oi="${oi}"]`); el&&el.classList.add("shake"); }
    const n=app.querySelector(".next.show"); n&&n.scrollIntoView&&n.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  const nb = document.getElementById("nextBtn");
  if(nb) nb.onclick = ()=>{ if(state.qi<NQ-1){ state.qi++; startQ(); top0(); } else { state.view="done"; renderDone(); top0(); } };
  const rb = document.getElementById("retryBtn");
  if(rb) rb.onclick = ()=>{ state.view="retry"; render(); top0(); };
}

/* ============ 画面：再チャレンジ ============ */
function renderRetry(){
  const sc = state.lastScore||0, best = store.get("kgz_best")||sc;
  const C = 2*Math.PI*42, off = C*(1-sc/NQ);
  const [,,exp] = t("q")[state.missed];
  app.innerHTML = `<section class="card fade">
    <div class="retry-hero">
      <div class="retry-ring">
        <svg class="ring" viewBox="0 0 96 96"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset=".5" stop-color="#e5303f"/><stop offset="1" stop-color="#9b1f5a"/></linearGradient></defs>
          <circle class="track" cx="48" cy="48" r="42"/><circle class="bar" id="ringBar" cx="48" cy="48" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="mid">${ic("retry")}</div>
      </div>
      <h2>${esc(t("retryTitle"))}</h2>
      <p>${esc(t("retryLead"))}</p>
    </div>
    <div class="stats">
      <div class="stat"><small>${esc(t("score"))}</small><b>${sc}<span> / ${NQ}</span></b></div>
      <div class="stat best"><small>${esc(t("best"))}</small><b>${best}<span style="-webkit-text-fill-color:var(--text-3)"> / ${NQ}</span></b></div>
    </div>
    <div class="dots">${[...Array(NQ).keys()].map(i=>`<i class="${i<sc?'ok':i===sc?'ng':''}"></i>`).join("")}</div>
    <div class="tip"><div class="tile">${ic(QICON[state.missed])}</div><div><small>${esc(t("missedTip"))}</small><p>${esc(exp)}</p></div></div>
    <div class="notice">${ic("alert")}<span>${esc(t("rule"))}</span></div>
    <button class="btn btn-primary" id="goBtn">${esc(t("go"))}${ic("arrow")}</button>
  </section>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const r=document.getElementById("ringBar"); if(r) r.style.strokeDashoffset=off; }));
  document.getElementById("goBtn").onclick = restartQuiz;
}

/* ============ 画面：クーポン ============ */
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function getCoupon(){
  const today = todayKey(); let c = store.get("kgz_coupon");
  if(!c || c.date!==today){
    const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r="";
    for(let i=0;i<4;i++) r+=chars[Math.floor(Math.random()*chars.length)];
    c = { date:today, code:"KGZ-"+today.slice(5).replace("-","")+"-"+r, spot:(location.hash||"").replace("#","")||"-" };
    store.set("kgz_coupon", c);
  }
  return c;
}
const OFFER_ICON = { offer10:"ticket", offerGift:"gift", offerDrink:"store" };

function renderDone(){
  const c = getCoupon();
  const dateStr = new Date().toLocaleDateString(LOCALE[lang],{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  const shopName = s => lang==="ja" ? s.ja : s.en;
  app.innerHTML = `<div class="fade">
    <section class="card">
      <div class="success">
        <div class="success-ring">${ic("check")}</div>
        <h2>${esc(t("doneTitle"))}</h2>
        <p>${esc(t("doneLead"))}</p>
      </div>
      <div class="ticket" role="region" aria-label="${esc(t("coupon"))}">
        <div class="ticket-head">
          <div><small>${ic("ticket")}KAGURAZAKA-DORI</small><h3>${esc(t("coupon"))}</h3></div>
          <div class="hanko" aria-hidden="true">横丁<br>マナー<br>認定</div>
        </div>
        <div class="perf"></div>
        <div class="ticket-body">
          <div class="live"><span class="live-tag"><span class="dot"></span>LIVE</span><span class="clock" id="clock">--:--:--</span></div>
          <div class="kv"><span>${esc(t("validOn"))}</span><strong>${esc(dateStr)}</strong></div>
          <div class="code">${esc(c.code)}</div>
          <div class="how">${ic("hand")}<span>${esc(t("couponHow"))}</span></div>
          <div class="terms">${esc(t("couponTerms"))}</div>
        </div>
      </div>
      <div class="staff">${ic("info")}<div><b>店舗スタッフの方へ</b>日付が本日であること、時計が動いていることをご確認ください。コード番号を控えていただくと、効果測定に使えます。${profile?`<div style="margin-top:6px;font-weight:700">グループ：${profile.people===5?"5名以上":profile.people+"名"} ・ ${esc(countryName(profile.country,"ja"))} ・ ${LANGS.find(l=>l[0]===lang)[1]}</div>`:""}</div></div>
    </section>

    <div class="section-title">${esc(t("shops"))}</div>
    <ul class="list">${SHOPS.map(s=>`<li><div class="tile soft">${ic("store")}</div><span class="grow">${esc(shopName(s))}</span><span class="badge-off">${esc(t(s.offer))}</span></li>`).join("")}</ul>
    <p class="note">${esc(t("shopNote"))}</p>

    <div class="section-title">${esc(t("remember"))}</div>
    <ul class="list">${[["quiet","r1"],["noCamera","r2"],["walk","r3"]].map(([i,k])=>`<li><div class="tile">${ic(i)}</div><span class="grow">${esc(t(k))}</span></li>`).join("")}</ul>

    <button class="btn btn-ghost" id="againBtn">${ic("retry")}${esc(t("restart"))}</button>
  </div>`;
  document.getElementById("againBtn").onclick = ()=>{ state.view="intro"; render(); top0(); };
  const tick = ()=>{ const el=document.getElementById("clock"); if(!el) return; el.textContent=new Date().toLocaleTimeString("ja-JP",{hour12:false}); };
  tick(); clearInterval(clockTimer); clockTimer=setInterval(tick,1000);
}

function render(){
  document.documentElement.lang = HTML_LANG[lang];
  document.getElementById("langLabel").textContent = LANGS.find(l=>l[0]===lang)[1];
  document.getElementById("globe").innerHTML = flag(LANG_FLAG[lang],"sm");
  if(state.view!=="done") clearInterval(clockTimer);
  if(state.view==="intro" && (!profile || !store.get("kgz_lang"))) state.view="setup";
  if(state.view==="setup") renderSetup();
  else if(state.view==="intro") renderIntro();
  else if(state.view==="quiz") renderQuiz();
  else if(state.view==="retry") renderRetry();
  else renderDone();
}

/* ============ 言語シート ============ */
document.getElementById("logo").innerHTML = ic("lantern");
document.getElementById("chev").innerHTML = ic("chevDown","chev");
const sheetBg = document.getElementById("sheetBg");
function openSheet(){
  document.getElementById("sheetTitle").innerHTML = ic("globe") + esc(t("lang"));
  document.getElementById("langList").innerHTML = LANGS.map(([c,n,e])=>
    `<button data-l="${c}" class="${c===lang?'cur':''}" lang="${HTML_LANG[c]}"><span class="lrow">${flag(LANG_FLAG[c])}<span><b>${n}</b><small>${e}</small></span></span><span class="check">${ic("check")}</span></button>`).join("");
  document.querySelectorAll("#langList button").forEach(b=>b.onclick=()=>{
    lang=b.dataset.l; store.set("kgz_lang",lang); if(draft) draft.langChosen=true; sheetBg.classList.remove("open"); render();
  });
  sheetBg.classList.add("open");
}
document.getElementById("langBtn").onclick = openSheet;
sheetBg.addEventListener("click",e=>{ if(e.target===sheetBg) sheetBg.classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") sheetBg.classList.remove("open"); });
window.addEventListener("hashchange",()=>{ if(state.view==="intro") render(); });

render();
</script>
</body>
</html>
